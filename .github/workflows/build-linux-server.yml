name: Build Linux server assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-server-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-server:
    name: Build amd64, arm64 and armv7 server binaries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Cache cargo-zigbuild
        uses: actions/cache@v6
        with:
          path: ~/.cargo-tools/cargo-zigbuild/bin
          key: ${{ runner.os }}-cargo-zigbuild-0.24.1-rust-1.97.1-v1

      - name: Install cargo-zigbuild
        run: |
          echo "$HOME/.cargo-tools/cargo-zigbuild/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.cargo-tools/cargo-zigbuild/bin/cargo-zigbuild" ]; then
            cargo install cargo-zigbuild --version 0.24.1 --locked --root "$HOME/.cargo-tools/cargo-zigbuild"
          fi
          cargo zigbuild --help >/dev/null

      - name: Verify build tools
        run: |
          rustc +1.97.1 --version
          cargo zigbuild --help
          zig version
          command -v pwsh

      - name: Build all Linux server variants and verify provenance
        run: bash ./rust-server/build_linux.sh --no-tests

      - name: Upload verified Linux server assets
        uses: actions/upload-artifact@v7
        with:
          name: shod-linux-server-assets
          path: |
            app/src/main/assets/shod-linux-amd64
            app/src/main/assets/shod-linux-arm64
            app/src/main/assets/shod-linux-armv7
            app/src/main/assets/shod.server-provenance.json
          if-no-files-found: error
          retention-days: 30
