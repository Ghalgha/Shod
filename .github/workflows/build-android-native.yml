name: Build Android Native Client

on:
  push:
    branches: [main, migration/phase-1-foundation]
    paths:
      - ".github/workflows/build-android-native.yml"
      - "rust-client/**"
      - "shared/wire_protocol.rs"
      - "scripts/native_client_provenance.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android native client (3 ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Install Rust toolchain and Android targets
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build all Android ABIs
        run: bash rust-client/build_android_wsl.sh arm64-v8a armeabi-v7a x86_64

      - name: Generate and verify native provenance
        shell: pwsh
        run: |
          ./scripts/native_client_provenance.ps1 -Mode Write -Producer rust-client/build_android_wsl.sh
          ./scripts/native_client_provenance.ps1 -Mode Verify

      - name: Upload verified native libraries and provenance
        uses: actions/upload-artifact@v4
        with:
          name: shod-android-native-client
          path: |
            app/src/main/jniLibs/arm64-v8a/libclient.so
            app/src/main/jniLibs/armeabi-v7a/libclient.so
            app/src/main/jniLibs/x86_64/libclient.so
            app/src/main/libclient.provenance.json
          if-no-files-found: error
          retention-days: 30
