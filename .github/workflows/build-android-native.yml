name: Build Android Native Client

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android native client (3 ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Install Rust toolchain and Android targets
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools/cargo-ndk/bin
          key: ${{ runner.os }}-cargo-ndk-4.1.2-rust-1.97.1-v1

      - name: Install cargo-ndk
        run: |
          echo "$HOME/.cargo-tools/cargo-ndk/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.cargo-tools/cargo-ndk/bin/cargo-ndk" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked --root "$HOME/.cargo-tools/cargo-ndk"
          fi
          cargo ndk --help >/dev/null

      - name: Diagnose Android Cargo lockfile resolution
        shell: bash
        run: |
          set -uo pipefail
          backup="$RUNNER_TEMP/android-Cargo.lock.before"
          cp rust-client/Cargo.lock "$backup"
          restore_lock() {
            cp "$backup" rust-client/Cargo.lock
          }
          trap restore_lock EXIT

          set +e
          cargo metadata --manifest-path rust-client/Cargo.toml \
            --format-version 1 \
            --filter-platform aarch64-linux-android
          metadata_status=$?
          set -e

          echo "Cargo metadata exit code: $metadata_status"
          echo "Differences Cargo wanted to make to rust-client/Cargo.lock:"
          diff -u "$backup" rust-client/Cargo.lock || true
          echo "Original Cargo.lock will be restored before the build."
          
      - name: Build all Android ABIs
        run: bash rust-client/build_android_wsl.sh arm64-v8a armeabi-v7a x86_64

      - name: Generate and verify native provenance
        shell: pwsh
        run: |
          ./scripts/native_client_provenance.ps1 -Mode Write -Producer rust-client/build_android_wsl.sh
          ./scripts/native_client_provenance.ps1 -Mode Verify

      - name: Upload verified native libraries and provenance
        uses: actions/upload-artifact@v4
        with:
          name: shod-android-native-client
          path: |
            app/src/main/jniLibs/arm64-v8a/libclient.so
            app/src/main/jniLibs/armeabi-v7a/libclient.so
            app/src/main/jniLibs/x86_64/libclient.so
            app/src/main/libclient.provenance.json
          if-no-files-found: error
          retention-days: 30
