name: CI

on:
  push:
    branches: [main, migration/phase-1-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-syntax:
    name: Deployment shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate installer and generated helpers
        run: |
          bash -n app/src/main/assets/deploy.sh
          awk '/^    cat > "\$target" << NETEOF$/ { capture=1; next } capture && /^NETEOF$/ { exit } capture { gsub(/\\\$/, "$"); print }' app/src/main/assets/deploy.sh > "$RUNNER_TEMP/shod-network-helper.sh"
          awk '/^    cat > "\$target" << RECOVEREOF$/ { capture=1; next } capture && /^RECOVEREOF$/ { exit } capture { gsub(/\\\$/, "$"); print }' app/src/main/assets/deploy.sh > "$RUNNER_TEMP/shod-tun-recovery.sh"
          sh -n "$RUNNER_TEMP/shod-network-helper.sh"
          sh -n "$RUNNER_TEMP/shod-tun-recovery.sh"

  server-assets:
    name: Build Linux server assets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Set up Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Cache server Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server
          cache-directories: |
            rust-server/build/linux-musl
            rust-server/build/zig-cache

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build and verify Linux server assets
        run: bash ./rust-server/build_linux.sh --no-tests

      - name: Upload Linux server assets
        uses: actions/upload-artifact@v4
        with:
          name: shod-linux-server-assets
          path: |
            app/src/main/assets/shod-linux-amd64
            app/src/main/assets/shod-linux-arm64
            app/src/main/assets/shod-linux-armv7
            app/src/main/assets/shod.server-provenance.json
          if-no-files-found: error
          retention-days: 1

  native-client:
    name: Build Android Native Client (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            suffix: arm64
          - abi: armeabi-v7a
            suffix: armv7
          - abi: x86_64
            suffix: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Cache Android Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client
          cache-directories: |
            build/rust-client-android-arm64
            build/rust-client-android-armv7
            build/rust-client-android-x86_64

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install Android native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup default 1.97.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Android native client (${{ matrix.abi }})
        run: bash rust-client/build_android_wsl.sh "${{ matrix.abi }}"

      - name: Upload Android native client (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: shod-android-native-client-${{ matrix.abi }}
          path: |
            app/src/main/jniLibs/${{ matrix.abi }}/
            build/rust-client-android-${{ matrix.suffix }}/
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android (lint, unit and instrumented tests, debug APK)
    runs-on: ubuntu-latest
    needs: [server-assets, native-client]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux server assets
        uses: actions/download-artifact@v4
        with:
          name: shod-linux-server-assets
          path: app/src/main/assets

      - name: Download Android native client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shod-android-native-client-*
          path: .
          merge-multiple: true

      - name: Generate and verify Android native client provenance
        shell: pwsh
        run: |
          ./scripts/native_client_provenance.ps1 -Mode Write -Producer rust-client/build_android_wsl.sh
          ./scripts/native_client_provenance.ps1 -Mode Verify

      - name: Verify Linux server asset provenance
        shell: pwsh
        run: ./scripts/server_asset_provenance.ps1 -Mode Verify

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run Android lint, unit tests, and assemble debug APK
        run: bash ./gradlew --no-daemon --stacktrace lintDebug lintRelease testDebugUnitTest assembleDebug

      - name: Run Android instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shod-debug-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-client
            rust-server

      - name: Capture Rust formatting diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path rust-client/Cargo.toml --all -- --check > "$RUNNER_TEMP/rust-client-fmt.txt" 2>&1
          client_status=$?
          cargo fmt --manifest-path rust-server/Cargo.toml --all -- --check > "$RUNNER_TEMP/rust-server-fmt.txt" 2>&1
          server_status=$?
          {
            echo "rust-client cargo fmt exit code: $client_status"
            echo "rust-server cargo fmt exit code: $server_status"
          } | tee "$RUNNER_TEMP/rust-fmt-status.txt"
          cat "$RUNNER_TEMP/rust-client-fmt.txt"
          cat "$RUNNER_TEMP/rust-server-fmt.txt"
          if [ "$client_status" -ne 0 ] || [ "$server_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Rust formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-format-diagnostics
          path: |
            ${{ runner.temp }}/rust-client-fmt.txt
            ${{ runner.temp }}/rust-server-fmt.txt
            ${{ runner.temp }}/rust-fmt-status.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Clippy — client
        working-directory: rust-client
        run: cargo clippy --all-targets -- -D warnings

      - name: Test — client
        working-directory: rust-client
        run: cargo test --all-targets

      - name: Clippy — server
        working-directory: rust-server
        run: cargo clippy --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

      - name: Test — server
        working-directory: rust-server
        run: cargo test --locked --target x86_64-unknown-linux-gnu --all-targets
