name: CI

on:
  push:
    branches: [main, migration/phase-1-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-syntax:
    name: Deployment shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate installer and generated helpers
        run: |
          bash -n app/src/main/assets/deploy.sh
          awk '/^    cat > "\$target" << NETEOF$/ { capture=1; next } capture && /^NETEOF$/ { exit } capture { gsub(/\\\$/, "$"); print }' app/src/main/assets/deploy.sh > "$RUNNER_TEMP/shod-network-helper.sh"
          awk '/^    cat > "\$target" << RECOVEREOF$/ { capture=1; next } capture && /^RECOVEREOF$/ { exit } capture { gsub(/\\\$/, "$"); print }' app/src/main/assets/deploy.sh > "$RUNNER_TEMP/shod-tun-recovery.sh"
          sh -n "$RUNNER_TEMP/shod-network-helper.sh"
          sh -n "$RUNNER_TEMP/shod-tun-recovery.sh"

  server-assets:
    name: Build Linux server (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: amd64
            asset: shod-linux-amd64
          - variant: arm64
            asset: shod-linux-arm64
          - variant: armv7
            asset: shod-linux-armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Set up Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Cache server Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server
          cache-directories: |
            rust-server/build/linux-musl
            rust-server/build/zig-cache

      - name: Restore cargo-zigbuild cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo-tools/cargo-zigbuild/bin
          key: ${{ runner.os }}-cargo-zigbuild-0.24.1-rust-1.97.1-v2

      - name: Install cargo-zigbuild
        run: |
          echo "$HOME/.cargo-tools/cargo-zigbuild/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.cargo-tools/cargo-zigbuild/bin/cargo-zigbuild" ]; then
            cargo install cargo-zigbuild --version 0.24.1 --locked --root "$HOME/.cargo-tools/cargo-zigbuild"
          fi
          cargo zigbuild --help >/dev/null

      - name: Save cargo-zigbuild cache
        if: matrix.variant == 'amd64'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo-tools/cargo-zigbuild/bin
          key: ${{ runner.os }}-cargo-zigbuild-0.24.1-rust-1.97.1-v2

      - name: Build Linux server (${{ matrix.variant }})
        run: bash ./rust-server/build_linux.sh --no-tests --variant "${{ matrix.variant }}"

      - name: Upload Linux server (${{ matrix.variant }})
        uses: actions/upload-artifact@v7
        with:
          name: shod-linux-server-${{ matrix.variant }}
          path: app/src/main/assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  android-native-client:
    name: Build Android native libraries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache Android Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client
          cache-directories: |
            build/rust-client-android-arm64
            build/rust-client-android-armv7
            build/rust-client-android-x86_64

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install Android native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Install cargo-ndk
        run: |
          echo "$HOME/.cargo-tools/cargo-ndk/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.cargo-tools/cargo-ndk/bin/cargo-ndk" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked --root "$HOME/.cargo-tools/cargo-ndk"
          fi
          export PATH="$HOME/.cargo-tools/cargo-ndk/bin:$PATH"
          cargo ndk --help >/dev/null

      - name: Build Android native libraries for APK
        run: bash rust-client/build_android_wsl.sh arm64-v8a armeabi-v7a x86_64

      - name: Generate and verify Android native client provenance
        shell: pwsh
        run: |
          ./scripts/native_client_provenance.ps1 -Mode Write -Producer rust-client/build_android_wsl.sh
          ./scripts/native_client_provenance.ps1 -Mode Verify

      - name: Upload Android native libraries
        uses: actions/upload-artifact@v7
        with:
          name: shod-android-native-libs
          path: |
            app/src/main/jniLibs/
            app/src/main/libclient.provenance.json
          if-no-files-found: error
          retention-days: 1

  android-checks:
    name: Android (lint and unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Run Android lint and unit tests
        run: bash ./gradlew --no-daemon --stacktrace lintDebug lintRelease testDebugUnitTest

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14

  android-package:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    needs: [server-assets, android-native-client]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux server assets
        uses: actions/download-artifact@v8
        with:
          pattern: shod-linux-server-*
          path: app/src/main/assets
          merge-multiple: true

      - name: Download Android native libraries
        uses: actions/download-artifact@v8
        with:
          name: shod-android-native-libs
          path: app/src/main

      - name: Generate and verify Linux server asset provenance
        shell: pwsh
        run: |
          ./scripts/server_asset_provenance.ps1 -Mode Write
          ./scripts/server_asset_provenance.ps1 -Mode Verify

      - name: Verify Linux server asset provenance
        shell: pwsh
        run: ./scripts/server_asset_provenance.ps1 -Mode Verify

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/migration/phase-1-foundation' }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Assemble debug APK
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: shod-debug-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

  rust-client:
    name: Rust client (format, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Cache client Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client

      - name: Check client formatting
        run: cargo fmt --manifest-path rust-client/Cargo.toml --all -- --check

      - name: Clippy — client
        working-directory: rust-client
        run: cargo clippy --all-targets -- -D warnings

      - name: Test — client
        working-directory: rust-client
        run: cargo test --all-targets

  rust-server:
    name: Rust server (format, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Cache client Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server

      - name: Check server formatting
        run: cargo fmt --manifest-path rust-server/Cargo.toml --all -- --check

      - name: Clippy — server
        working-directory: rust-server
        run: cargo clippy --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

      - name: Test — server
        working-directory: rust-server
        run: cargo test --locked --target x86_64-unknown-linux-gnu --all-targets
